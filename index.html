<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Query Demo — Credential Filter</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --primary: #4f6ef7;
      --primary-hover: #3b5de5;
      --border: #dfe3e8;
      --text: #23272f;
      --text-muted: #6b7785;
      --green: #27ae60;
      --orange: #f39c12;
      --red: #e74c3c;
      --blue: #3498db;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #4f6ef7 0%, #7c5ce0 100%);
      color: #fff;
      padding: 28px 32px;
      box-shadow: 0 2px 8px rgba(79, 110, 247, .25);
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header p  { font-size: 13px; opacity: .85; margin-top: 4px; }

    /* ── Layout ── */
    .container { max-width: 1360px; margin: 0 auto; padding: 24px; }

    /* ── Global Search ── */
    .global-search {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .global-search .icon { font-size: 20px; color: var(--text-muted); }
    .global-search input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      transition: border-color .2s;
    }
    .global-search input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, .12);
    }
    .global-search .hint {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Filters Bar ── */
    .filters-bar {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .filters-bar h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }
    .filter-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .filter-group select,
    .filter-group input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: var(--text);
      transition: border-color .2s;
    }
    .filter-group select:focus,
    .filter-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, .12);
    }
    .filter-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-outline:hover { background: #f5f6fa; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { background: #219a52; }
    .result-count {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
    }
    .result-count strong { color: var(--primary); }

    /* ── Table ── */
    .table-wrap {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      position: sticky;
      top: 0;
      background: #f8f9fc;
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .5px;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }
    thead th:hover { background: #eef0f7; }
    thead th .sort-arrow { margin-left: 4px; font-size: 10px; opacity: .4; }
    thead th.sorted .sort-arrow { opacity: 1; color: var(--primary); }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: #f5f7ff; }
    tbody td {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f1f5;
      white-space: nowrap;
    }
    tbody td.highlight { background: #fff8e1; }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green  { background: #e8f8ef; color: var(--green); }
    .badge-orange { background: #fef5e7; color: var(--orange); }
    .badge-red    { background: #fdecea; color: var(--red); }
    .badge-blue   { background: #eaf2fb; color: var(--blue); }
    .badge-gray   { background: #f0f1f5; color: var(--text-muted); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .empty .icon { font-size: 36px; margin-bottom: 8px; }
  </style>
</head>

<header>
  <h1>🔍 Search Query Demo — Credential Filter</h1>
  <p>Filter credentials across all columns • Sort by clicking headers • Export filtered results</p>
</header>

  <!-- Global Search -->
  <div class="global-search">
    <span class="icon">🔎</span>
    <input type="text" id="globalSearch" placeholder="Search across all columns…" />
    <span class="hint">e.g. "Facebook", "2FA Expired", "user1048"</span>
  </div>

  <!-- Column Filters -->
  <div class="filters-bar">
    <h2>⚙ Column Filters</h2>
    <div class="filter-grid" id="filterGrid"></div>
    <div class="filter-actions">
      <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
      <button class="btn btn-outline" onclick="resetFilters()">Reset All</button>
      <button class="btn btn-green" onclick="exportCSV()">⬇ Export CSV</button>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

/* ───────────────────────────────────────────
   State
   ─────────────────────────────────────────── */
const headers = DATA.headers;
let rawData = DATA.rows;
let filteredData = [...rawData];
let sortCol = null;
let sortDir = 'asc'; // 'asc' or 'desc'

/* ───────────────────────────────────────────
   Build filter controls
   ─────────────────────────────────────────── */
function buildFilters() {
  const grid = document.getElementById('filterGrid');
  grid.innerHTML = '';

  headers.forEach(h => {
    const group = document.createElement('div');
    group.className = 'filter-group';
    const unique = [...new Set(rawData.map(r => r[h]))].sort();
    const isSmallSet = unique.length <= 15 && unique.length > 1;

    if (isSmallSet) {
      group.innerHTML = `
        <label>${h}</label>
        <select data-col="${h}">
          <option value="">All</option>
          ${unique.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('')}
        </select>`;
    } else {
      group.innerHTML = `
        <label>${h}</label>
        <input type="text" data-col="${h}" placeholder="Search ${h}…" />`;
    }
    grid.appendChild(group);
  });

  grid.querySelectorAll('input[type="text"]').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });
  });
}

/* ───────────────────────────────────────────
   Apply all filters (global + column)
   ─────────────────────────────────────────── */
function applyFilters() {
  const globalVal = document.getElementById('globalSearch').value.trim().toLowerCase();

  filteredData = rawData.filter(row => {
    // Global search: match any column
    if (globalVal) {
      const rowText = headers.map(h => row[h]).join(' ').toLowerCase();
      if (!rowText.includes(globalVal)) return false;
    }
    // Column-specific filters
    for (const group of document.querySelectorAll('#filterGrid .filter-group')) {
      const col = group.querySelector('[data-col]').dataset.col;
      const el  = group.querySelector('[data-col]');
      const val = el.value.trim();
      if (!val) continue;
      if (el.tagName === 'SELECT') {
        if (row[col] !== val) return false;
      } else {
        if (!row[col].toLowerCase().includes(val.toLowerCase())) return false;
      }
    }
    return true;
  });

  // Re-apply current sort if active
  if (sortCol) sortData(sortCol, false);
  renderTable();
}

  document.getElementById('globalSearch').value = '';
  document.querySelectorAll('#filterGrid select').forEach(s => s.value = '');
  document.querySelectorAll('#filterGrid input[type="text"]').forEach(i => i.value = '');
  sortCol = null;
  sortDir = 'asc';
  filteredData = [...rawData];
  renderTable();
}

/* ───────────────────────────────────────────
   Column sorting
   ─────────────────────────────────────────── */
function sortBy(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }
  sortData(col, true);
  renderTable();
}

function sortData(col, toggle) {
  filteredData.sort((a, b) => {
    let va = a[col] || '';
    let vb = b[col] || '';
    // Try numeric comparison
    const na = Number(va), nb = Number(vb);
    if (!isNaN(na) && !isNaN(nb)) {
      return sortDir === 'asc' ? na - nb : nb - na;
    }
    // String comparison
    va = va.toLowerCase(); vb = vb.toLowerCase();
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

/* ───────────────────────────────────────────
   Render table
   ─────────────────────────────────────────── */
function renderTable() {
  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');
  const globalVal = document.getElementById('globalSearch').value.trim().toLowerCase();

  // Header with sort arrows
  head.innerHTML = '<tr>' + headers.map(h => {
    const arrow = sortCol === h ? (sortDir === 'asc' ? '▲' : '▼') : '▲';
    const cls = sortCol === h ? ' class="sorted"' : '';
    return `<th${cls} onclick="sortBy('${h.replace(/'/g, "\\'")}')">${h}<span class="sort-arrow">${arrow}</span></th>`;
  }).join('') + '</tr>';

  // Body
  if (!filteredData.length) {
    body.innerHTML = `<tr><td colspan="${headers.length}" class="empty">
      <div class="icon">🔎</div><p>No records match your filters.</p></td></tr>`;
  } else {
    body.innerHTML = filteredData.map(row =>
      '<tr>' + headers.map(h => {
        let cell = formatCell(h, row[h]);
        // Highlight global search matches
        if (globalVal && row[h].toLowerCase().includes(globalVal)) {
          cell = `<span class="highlight">${cell}</span>`;
        }
        return `<td>${cell}</td>`;
      }).join('') + '</tr>'
    ).join('');
  }

  document.getElementById('resultCount').innerHTML =
    `Showing <strong>${filteredData.length}</strong> of <strong>${rawData.length}</strong> records`;
}

/* ───────────────────────────────────────────
   Cell formatters
   ─────────────────────────────────────────── */
function formatCell(col, val) {
  if (col === 'Status In Watch') return badgeForStatus(val);
  if (col === 'Status in UI')    return badgeForUIStatus(val);
  if (col === 'Stored Credential') return val === 'Yes'
    ? '<span class="badge badge-green">Yes</span>'
    : '<span class="badge badge-gray">No</span>';
  return escapeHtml(val);
}

function badgeForStatus(v) {
  const cls = {
    'Connected':          'badge-green',
    '2FA Expired':        'badge-orange',
    'Account not Ready':  'badge-blue',
    'Login Failed':       'badge-red',
  }[v] || 'badge-gray';
  return `<span class="badge ${cls}">${escapeHtml(v)}</span>`;
}

function badgeForUIStatus(v) {
  const cls = {
    'Connected':          'badge-green',
    'Action Required':    'badge-orange',
    'Download Delayed':   'badge-blue',
    'Account not Ready':  'badge-blue',
    'Login Failed':       'badge-red',
  }[v] || 'badge-gray';
  return `<span class="badge ${cls}">${escapeHtml(v)}</span>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ───────────────────────────────────────────
   Export CSV
   ─────────────────────────────────────────── */
function exportCSV() {
  const rows = [headers.join(',')];
  filteredData.forEach(row => {
    rows.push(headers.map(h => {
      const v = row[h] || '';
      return v.includes(',') || v.includes('"') || v.includes('\n')
        ? `"${v.replace(/"/g, '""')}"` : v;
    }).join(','));
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'filtered_credentials.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ───────────────────────────────────────────
   Global search live typing
   ─────────────────────────────────────────── */
document.getElementById('globalSearch').addEventListener('input', () => applyFilters());

/* ───────────────────────────────────────────
   Init
   ─────────────────────────────────────────── */
buildFilters();
renderTable();
</script>

</body>
